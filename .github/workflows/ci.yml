name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

permissions:
  contents: read

jobs:
  build-test-package:
    runs-on: macos-14
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Show toolchain
        run: swift --version

      - name: Build
        run: swift build

      - name: Test
        run: swift test

      - name: Package app
        run: make zip

      - name: Upload app artifact
        uses: actions/upload-artifact@v4
        with:
          name: Overlay-macOS
          path: dist/Overlay-macOS.zip
          if-no-files-found: error
